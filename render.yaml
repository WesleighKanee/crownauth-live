# Free Render web service — no paid plan
# Dashboard: New + > Blueprint > connect this repo
# Or: New Web Service > Docker > root = owner_panel
#
# After deploy, set PUBLIC_HOST to your-service.onrender.com
# Keep awake free: UptimeRobot or cron-job.org GET/HEAD /v2/ping every 5 min
# (/v2/health also works). Internal 127.0.0.1 ticks do NOT prevent free-tier sleep.

services:
  - type: web
    name: crownauth
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /v2/health
    envVars:
      - key: PORT
        value: "8787"
      - key: CROWNAUTH_DATA
        value: /data
      - key: PUBLIC_HOST
        sync: false
      # Optional, explicit reverse-proxy CIDRs. Forwarded client identity is
      # ignored unless this is configured; never set it to 0.0.0.0/0.
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      # Required to publish and serve v3 encrypted payload objects. Configure
      # a random 32-byte base64 value in the Render dashboard before enabling
      # v3 publication; it must never be committed to this repository.
      - key: CROWNAUTH_PAYLOAD_MASTER_KEY
        sync: false
      # Optional Cloudflare R2/custom-domain base for large .so downloads.
      # Upload objects using the exact panel names (for example OWLLIQUID.so).
      - key: LIB_CDN_BASE
        sync: false
      - key: LIB_GITHUB_REPO
        value: WesleighKanee/crownauth-live
      - key: LIB_GITHUB_RELEASE_TAG
        value: library-cdn-v1
      # Optional dedicated token. Existing GITHUB_TOKEN is used as fallback.
      - key: LIB_GITHUB_TOKEN
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
