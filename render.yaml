# Free Render web service — no paid plan
# Dashboard: New + > Blueprint > connect this repo
# Or: New Web Service > Docker > root = owner_panel
#
# After deploy, set PUBLIC_HOST to your-service.onrender.com
# Keep awake free: UptimeRobot or cron-job.org GET/HEAD /v2/ping every 5 min
# (/v2/health also works). Internal 127.0.0.1 ticks do NOT prevent free-tier sleep.

services:
  - type: web
    name: crownauth
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /v2/health
    envVars:
      - key: PORT
        value: "8787"
      - key: CROWNAUTH_DATA
        value: /data
      - key: PUBLIC_HOST
        sync: false
      # Optional Cloudflare R2/custom-domain base for large .so downloads.
      # Upload objects using the exact panel names (for example OWLLIQUID.so).
      - key: LIB_CDN_BASE
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
